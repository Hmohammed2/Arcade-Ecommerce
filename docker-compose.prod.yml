services:
  db-uat:
    container_name: postgres_db_uat
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "7015:5432"
    volumes:
      - postgres_data_uat:/var/lib/postgresql/data
    networks:
      - app_net
  django-backend-uat:
    container_name: django-backend-uat
    build:
      context: ./Ecommerce_app
      dockerfile: Dockerfile.prod
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        gunicorn Ecommerce_app.wsgi:application --bind 0.0.0.0:8000 --workers=4
      "
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ENV: ${DJANGO_ENV}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE}
    volumes:
      - ./Ecommerce_app/static:/code/static
      - ./Ecommerce_app/media:/code/media
      - ./Ecommerce_app:/code
    depends_on:
      - db-uat
    ports:
      - "7014:8000"
    networks:
      - app_net
  frontend-uat:
    container_name: frontend-uat
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile.prod
    ports:
      - "7013:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app_net
  stripe:
    image: stripe/stripe-cli
    container_name: stripe
    command:
      [
        "listen",
        "--forward-to",
        "https://arcadesticklabs-test.ddns.net/api/payments/webhook/",
      ]
    volumes:
      - stripe-cli-config:/root/.config/stripe
    depends_on:
      - django-backend-uat
    networks:
      - app_net
volumes:
  postgres_data_uat:
  stripe-cli-config:

networks:
  app_net:
